# ============================================================
# .github/workflows/retrain-pun.yml
# Metti questo file in .github/workflows/ del repo GitHub.
# ============================================================
name: retrain-pun

on:
  schedule:
    - cron: "0 3 * * 0"        # ogni domenica 03:00 UTC (~04:00/05:00 in Italia)
  workflow_dispatch:            # bottone "Run workflow" per lanciarlo a mano

concurrency:                    # niente run sovrapposti
  group: retrain-pun
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 300        # taglia il job se supera 5h (limite hard runner = 6h)
    steps:
      - uses: actions/checkout@v4
        # --- Se il codice sta SOLO nello Space HF (non su GitHub), togli lo step
        #     sopra e usa questo per clonare il repo dello Space (HF_TOKEN se privato):
        # - name: Clona lo Space HF
        #   run: git clone https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/<owner>/<space>.git .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installa dipendenze
        # Consiglio: un requirements-train.txt SENZA gradio (job più veloce).
        run: pip install -r requirements.txt

      - name: Retrain
        run: python retrain_headless.py
        env:
          # ⚠️ RISPECCHIA QUI ESATTAMENTE gli env var che dropbox_io.get_dbx() legge.
          # Caso A — token singolo (ATTENZIONE alla durata, vedi note):
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          # Caso B — refresh-token flow (CONSIGLIATO: non scade). Scommenta e togli sopra:
          # DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          # DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          # DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}

          MAX_PINBALL_REGRESSION: "0.25"
          MAX_DATASET_AGE_HOURS: "96"   # rifiuta il training se il dataset è più vecchio di 4 giorni
          PROMOTE: "1"

          # Notifica opzionale (lascia vuoto se non la usi):
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # (opzionale) salva i log come artifact anche se il job fallisce
      - name: Salva log
        if: always()
        run: echo "vedi lo step Retrain per il log completo"
